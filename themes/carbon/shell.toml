[bar]
background = "#141416"
text = "#ececf0"
active = "#e48791"

[hyprland]
active-border = "#666666"
active-border-foreground = "#adadad"

[controls]
normal-color = "#ececec"
normal-fill-alpha = 0.025
normal-border = "#393939"
normal-border-alpha = 1.0
hover-cursor-color = "#ececec"
hover-cursor-fill-alpha = 0.05
hover-cursor-border = "#393939"
hover-cursor-border-alpha = 1.0
focus-color = "#d6d6d6"
focus-fill-alpha = 0.10
focus-border = "#d6d6d6"
focus-border-alpha = 0.85
selected-color = "#d6d6d6"
selected-fill-alpha = 0.12
selected-border-width = 0
selection-color = "#d6d6d6"
selection-fill-alpha = 0.22

[popups]
background = "#202020"
text = "#ececec"
border = "#393939"

[tooltip]
background = "#262626"
text = "#ececec"
border = "#393939"

[notifications]
background = "#202020"
text = "#ececec"
border = "#393939"
countdown = "#d6d6d6"

[launcher]
dock-layout = "bottom-search"
background = "#1c1c1c"
background-alpha = 1.0
text = "#ececec"
border = "#393939"
scrim = "#090909"
selected-background = "#2b2b2b"
selected-background-alpha = 1.0
selected-text = "#d6d6d6"
selected-border = "#393939"
selected-border-alpha = 1.0

[menu]
layout = "bottom-sidebar"
background = "#090909"
text = "#ececec"
border = "#393939"
border-width = 0
scrim = "#090909"
scrim-alpha = 0.20
selected-background = "#242424"
selected-background-alpha = 1.0
selected-text = "#d6d6d6"
selected-border = "#393939"
selected-border-alpha = 0

[polkit]
background = "#202020"
text = "#ececec"
text-error = "#db9191"
border = "#393939"
border-error = "#db9191"
scrim = "#090909"
accent = "#d6d6d6"

[lock]
background = "#1c1c1c"
text = "#ececec"
placeholder = "#adadad"
text-error = "#db9191"
border = "#393939"
border-active = "#d6d6d6"
border-error = "#db9191"
selection = "#d6d6d6"

[image-picker]
text = "#ececec"
selected-border = "#d6d6d6"
unselected-border = "#adadad"
